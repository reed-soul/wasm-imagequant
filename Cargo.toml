[package]
name = "wasm-imagequant"
version = "0.1.4"
edition = "2021"
authors = ["reed-soul <https://github.com/reed-soul>"]
description = "High-performance perceptual color quantization and PNG compressor in WebAssembly (Rust)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/reed-soul/wasm-imagequant"
homepage = "https://github.com/reed-soul/wasm-imagequant"
readme = "README.md"
keywords = ["wasm", "webassembly", "imagequant", "pngquant", "image-compression"]
categories = ["multimedia::images", "wasm"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
miniz_oxide = "0.7"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[dev-dependencies]
imagequant = "4.4"
image = { version = "0.24", default-features = false, features = ["png", "jpeg"] }


