name: CI & Release Pipeline

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  test:
    name: Rust Tests & Benchmarks Check
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run unit & integration tests
        run: cargo test --verbose

      - name: Verify examples and benchmarks compile
        run: cargo check --examples

  wasm-build:
    name: WebAssembly Build & Artifacts
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Rust & WASM target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build WebAssembly (Release)
        run: wasm-pack build --target web --release

      - name: Verify WASM binary size
        run: |
          WASM_FILE="pkg/wasm_imagequant_bg.wasm"
          if [ ! -f "$WASM_FILE" ]; then
            echo "Error: $WASM_FILE not found!"
            exit 1
          fi
          FILE_SIZE=$(stat -c%s "$WASM_FILE")
          MAX_SIZE=204800 # 200 KB limit
          echo "WASM binary size: $FILE_SIZE bytes (limit: $MAX_SIZE bytes)"
          if [ "$FILE_SIZE" -gt "$MAX_SIZE" ]; then
            echo "Error: WASM bundle exceeds budget!"
            exit 1
          fi

      - name: Archive compiled WebAssembly package
        uses: actions/upload-artifact@v7
        with:
          name: wasm-imagequant-pkg
          path: pkg/

  release:
    name: GitHub Release & NPM Publish
    runs-on: ubuntu-24.04
    needs: wasm-build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download WASM artifact
        uses: actions/download-artifact@v8
        with:
          name: wasm-imagequant-pkg
          path: pkg/

      - name: Package release ZIP
        run: |
          cd pkg && zip -r ../wasm-imagequant-dist.zip . && cd ..

      - name: Create GitHub Release
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists, skipping create."
          else
            gh release create "$GITHUB_REF_NAME" wasm-imagequant-dist.zip --generate-notes
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: latest

      - name: Publish to NPM
        run: |
          cd pkg
          pnpm publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
